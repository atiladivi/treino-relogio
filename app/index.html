<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fichas de Treino</title>
<style>
:root {
  --bg: #f4f5f7; --surface: #ffffff; --surface-2: #eef0f3; --line: #dfe2e7;
  --ink: #16181d; --ink-2: #4a505c; --ink-3: #7a8190;
  --accent: #2563c9; --accent-ink: #ffffff; --accent-soft: #e3ecfa;
  --accent-fill: #2563c9; --accent-fill-ink: #ffffff; --surface-hi: #ffffff;
  --good: #16794a; --good-soft: #e1f3e9; --warn: #a15c00; --bad: #b42318;
  --gold: #a66b00; --gold-soft: #fdf1d6;
  --radius: 14px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  /* cores dos grupos musculares (paleta validada para daltonismo) */
  --g-peito: #e34948; --g-costas: #2a78d6; --g-ombro: #eb6834; --g-biceps: #6250d6;
  --g-triceps: #e87ba4; --g-pernas: #008300; --g-abdomen: #eda100; --g-outro: #898781;
  --corpo: #c4cad3; --corpo-linha: #aab1bd; --corpo-musc: #e2e6eb;
  /* etiquetas do card: método, inclinação, pegada */
  --c-exec: #2563c9; --c-desc: #e8a33a; --c-troca: #9aa1ad;
  --t-m: #3c3489; --t-m-bg: #eeedfe; --t-i: #085041; --t-i-bg: #e1f5ee; --t-p: #633806; --t-p-bg: #faeeda;
}
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark;
    --bg: #0f1115; --surface: #181b21; --surface-2: #22262e; --line: #2d323c;
    --ink: #eceef2; --ink-2: #b4bac6; --ink-3: #868d9b;
    --accent: #6ea2f5; --accent-ink: #0b1220; --accent-soft: #1c2a42;
    --accent-fill: #3b6fd1; --accent-fill-ink: #ffffff; --surface-hi: #1f232b;
    --good: #4cc38a; --good-soft: #15291f; --warn: #f0a640; --bad: #f97066;
    --gold: #f2c14e; --gold-soft: #2d2512;
    --shadow: none;
    --g-peito: #e66767; --g-costas: #3987e5; --g-ombro: #d95926; --g-biceps: #9085e9;
    --g-triceps: #d55181; --g-pernas: #008300; --g-abdomen: #c98500;
    --corpo: #2b3039; --corpo-linha: #5b6372; --corpo-musc: #4b5262;
    --c-exec: #6ea2f5; --c-desc: #e0a040; --c-troca: #6b7280;
    --t-m: #cecbf6; --t-m-bg: #2e2a5e; --t-i: #9fe1cb; --t-i-bg: #0e3a30; --t-p: #fac775; --t-p-bg: #45290a;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
main { max-width: 760px; margin: 0 auto; padding: 16px 16px 120px; }
h1 { font-size: 22px; margin: 4px 0 14px; }
h2 { font-size: 17px; margin: 22px 0 10px; }
h3 { font-size: 15px; margin: 0; }
.muted { color: var(--ink-3); } .small { font-size: 13px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 14px; margin-bottom: 10px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px;
  cursor: pointer; font-weight: 500; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent-fill); color: var(--accent-fill-ink); border-color: var(--accent-fill); }
/* botões suaves: só um botão cheio por tela, o resto em tom claro */
.btn.soft { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.btn.ok-soft { background: var(--good-soft); color: var(--good); border-color: transparent; }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
.chip.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 500; }
.badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.badge.accent { background: var(--accent-soft); color: var(--accent); }
.badge.gold { background: var(--gold-soft); color: var(--gold); font-weight: 600; }
.badge.good { background: var(--good-soft); color: var(--good); }
label.field { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 10px; }
label.field > * { display: block; width: 100%; margin-top: 4px; }
input[type=date], select, textarea, input[type=text], input[type=search], input:not([type]) { border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 10px; padding: 9px 10px; }
textarea { width: 100%; min-height: 64px; resize: vertical; }

/* nav */
nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line);
  display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); z-index: 20; }
nav.tabs button { flex: 1; max-width: 190px; border: 0; background: none; padding: 9px 4px 10px; cursor: pointer;
  color: var(--ink-3); font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav.tabs button .ico { font-size: 20px; line-height: 1; filter: grayscale(1); opacity: .7; }
nav.tabs button.on { color: var(--accent); font-weight: 600; }
nav.tabs button.on .ico { filter: none; opacity: 1; }

/* treino */
.ex { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 10px 12px; margin-bottom: 8px; }
.ex.done { border-color: var(--good); background: linear-gradient(0deg, var(--good-soft), var(--good-soft)) padding-box; }
.check { width: 30px; height: 30px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface);
  display: grid; place-items: center; cursor: pointer; font-size: 17px; color: transparent; padding: 0; }
.ex.done .check { background: var(--good); border-color: var(--good); color: #fff; }
.ex { border-left: 4px solid var(--gc, var(--line)); }
.ex.done { border-left-color: var(--gc, var(--good)); }
.ex .topo { display: flex; gap: 10px; align-items: flex-start; }
.ex .topo > .txt { flex: 1; min-width: 0; }
.thumb { flex: none; width: 46px; height: 46px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line);
  background: var(--surface-2); padding: 0; cursor: zoom-in; display: grid; place-items: center; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; background: #fff; }
.thumb svg { width: 100%; height: 100%; }
.gdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--gc, var(--g-outro)); flex: none; }
.gtag { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); font-weight: 500; }
.dots { display: inline-flex; gap: 4px; align-items: center; }
.foto-modal .modal { max-width: 420px; padding: 0; overflow: hidden; }
.foto-modal .foto { position: relative; background: #fff; aspect-ratio: 3 / 2; }
.foto-modal .foto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: opacity .35s; }
.foto-modal .corpo-grande { background: var(--surface-2); padding: 12px; display: flex; justify-content: center; }
.foto-modal .corpo-grande svg { width: 240px; height: auto; }
.foto-modal .info { padding: 14px 16px 16px; }
.ex .nome { display: flex; gap: 8px; align-items: baseline; min-height: 22px; }
.ex .abrir { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.ex .abrir .hist { margin-top: 3px; }
.ex .chev { color: var(--ink-3); font-size: 13px; }
.ex.aberto { box-shadow: 0 0 0 2px var(--gc, var(--accent)) inset, var(--shadow); }
.ex .det { display: grid; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
.ex .campo { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--ink-2); }
.ex input.curto { width: 90px; text-align: center; }
.ex .nome h3 { flex: 1; min-width: 0; }
.ex .sr { font-size: 13px; color: var(--ink-2); max-width: 45%; text-align: right; font-variant-numeric: tabular-nums; }
.ex .meta { font-size: 12px; color: var(--ink-3); margin-top: 1px; }
.ex .linha { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.ex .hist { flex: 1; min-width: 0; font-size: 12px; color: var(--ink-3); line-height: 1.3; }
.ex .hist b { color: var(--ink-2); font-weight: 600; }
.ex .nota-btn { border: 0; background: none; padding: 4px; font-size: 18px; cursor: pointer; opacity: .55; }
.ex .nota-btn.on { opacity: 1; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.stepper button { border: 0; background: var(--surface-2); width: 36px; height: 36px; font-size: 19px; cursor: pointer; }
.stepper input { width: 58px; height: 36px; border: 0; text-align: center; font-size: 17px; font-weight: 600; background: transparent;
  font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.unit { color: var(--ink-3); font-size: 13px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.tag { display: inline-block; max-width: 100%; font-size: 12px; line-height: 1.35; padding: 2px 8px; border-radius: 10px;
  background: var(--surface-2); color: var(--ink-2); }
.tag b { font-weight: 600; }
.tag.m { background: var(--t-m-bg); color: var(--t-m); }
.tag.i { background: var(--t-i-bg); color: var(--t-i); }
.tag.p { background: var(--t-p-bg); color: var(--t-p); }
.ex .obsf { font-size: 12px; color: var(--ink-2); margin-top: 5px; }
.drops { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; }
.drop { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.drop input { width: 54px; height: 34px; border: 0; text-align: center; font-size: 16px; font-weight: 600; background: transparent;
  font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.drop input::-webkit-outer-spin-button, .drop input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.drop button { border: 0; background: var(--surface-2); width: 26px; height: 34px; cursor: pointer; color: var(--ink-3); padding: 0; }
/* topo do treino */
.topo-treino { position: sticky; top: 0; z-index: 12; margin: -16px -16px 12px; padding: 10px 12px 0; background: var(--surface);
  border-bottom: 1px solid var(--line); box-shadow: var(--shadow); }
.topo-treino .l1 { display: flex; align-items: center; gap: 6px; }
.topo-treino .tit { flex: 1; min-width: 0; }
.topo-treino .tit b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topo-treino .tit span { font-size: 12px; color: var(--ink-3); }
.ico-btn { border: 0; background: none; width: 36px; height: 36px; border-radius: 10px; cursor: pointer; font-size: 20px; color: var(--ink-2);
  display: grid; place-items: center; padding: 0; flex: none; }
.ico-btn:active { background: var(--surface-2); }
.topo-treino .geral { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.topo-treino .geral.pausado { color: var(--ink-3); }
.topo-treino .st { font-size: 13px; color: var(--ink-2); margin: 4px 0 0 42px; cursor: pointer; min-height: 18px; }
.topo-treino .st b { font-variant-numeric: tabular-nums; }
.topo-treino .progress { margin: 8px -12px 0; border-radius: 0; height: 4px; }
.topo-treino.flash { animation: flash 1.4s ease-out; }
/* menu ⋮ e janelas */
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 60; display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease-out; }
.sheet .painel { background: var(--surface); width: 100%; max-width: 520px; border-radius: 18px 18px 0 0; padding: 10px 10px calc(14px + env(safe-area-inset-bottom));
  animation: sobe .22s cubic-bezier(.2,.8,.2,1); }
.sheet .op { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; padding: 13px 12px; font-size: 16px; border-radius: 12px; cursor: pointer; text-align: left; }
.sheet .op:active { background: var(--surface-2); }
.sheet .op.perigo { color: var(--bad); }
.sheet .op small { display: block; color: var(--ink-3); font-size: 12px; }
.sheet h3 { padding: 6px 12px 8px; color: var(--ink-3); font-size: 13px; font-weight: 500; }
/* tela inicial */
.home-top { display: flex; align-items: center; gap: 10px; margin: 4px 0 12px; }
.home-top h1 { flex: 1; margin: 0; text-transform: capitalize; }
.ficha-chip { position: relative; display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 500; }
.ficha-chip select { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.semana { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; text-align: center; }
.semana .d { font-size: 11px; color: var(--ink-3); }
.semana .b { width: 34px; height: 34px; border-radius: 50%; margin: 3px auto 0; display: grid; place-items: center; font-size: 12px; font-weight: 600;
  color: var(--ink-3); background: var(--surface-2); }
.semana .b.on { background: var(--accent-soft); color: var(--accent); animation: pop .35s both; }
.semana .b.hoje { box-shadow: 0 0 0 1.5px var(--ink-3); }
.proximo { background: var(--surface-hi); border-left: 4px solid var(--accent); animation: entra .35s .1s both; }
.proximo h2 { margin: 2px 0 4px; font-size: 19px; }
.proximo .exs { font-size: 13px; color: var(--ink-2); margin-top: 10px; line-height: 1.5; }
.proximo .btn { width: 100%; margin-top: 12px; padding: 12px; font-size: 16px; }
.dia-linha { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.dia-linha:last-child { border-bottom: 0; }
.dia-linha b { width: 46px; flex: none; }
.dia-linha .f { flex: 1; min-width: 0; }
.dia-linha .q { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.banner { display: flex; align-items: center; gap: 10px; background: var(--good-soft); color: var(--good); border-radius: 14px; padding: 12px 14px;
  margin-bottom: 10px; cursor: pointer; animation: entra .3s both; }
.banner .txt { flex: 1; color: var(--ink); font-size: 14px; }
.banner .txt span { color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.pulso { width: 10px; height: 10px; border-radius: 50%; background: var(--good); animation: pulso 1.6s ease-in-out infinite; flex: none; }
/* anel do descanso */
.anel { width: 58px; height: 58px; flex: none; position: relative; display: grid; place-items: center; }
.anel svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.anel circle { fill: none; stroke-width: 5; }
.anel .fundo { stroke: var(--line); }
.anel .arco { stroke: var(--good); stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke .3s; }
.anel.over .arco { stroke: var(--bad); }
.anel.over { animation: pulso 1.2s ease-in-out infinite; }
.anel b { position: relative; font-size: 13px; font-variant-numeric: tabular-nums; }
/* animações */
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }
@keyframes estala { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }
@keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes abre { from { opacity: 0; max-height: 0; transform: translateY(-6px); } to { opacity: 1; max-height: 900px; transform: none; } }
@keyframes fecha { from { opacity: 1; max-height: 900px; } to { opacity: 0; max-height: 0; margin-top: 0; padding-top: 0; } }
@keyframes verde { 0% { background-color: var(--good-soft); box-shadow: 0 0 0 0 var(--good); } 50% { box-shadow: 0 0 0 4px var(--good-soft); } 100% { box-shadow: var(--shadow); } }
@keyframes flash { 0%, 30%, 60% { background: var(--accent-soft); } 15%, 45%, 100% { background: var(--surface); } }
@keyframes pulso { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes sobe { from { transform: translateY(100%); } to { transform: none; } }
@keyframes cai { to { transform: translate(var(--dx), 105vh) rotate(var(--rot)); opacity: .9; } }
.ex .det.abrindo { animation: abre .26s cubic-bezier(.2,.8,.2,1); overflow: hidden; }
.ex .det.fechando { animation: fecha .18s ease-in forwards; overflow: hidden; }
.ex.concluiu { animation: verde .7s ease-out; }
.ex.concluiu .check { animation: estala .35s ease-out; }
.bump { animation: estala .3s ease-out; display: inline-block; }
.badge.gold { animation: pop .4s both; }
.progress.cheio > div { animation: pulso 1s ease-in-out 2; }
.entrando { animation: pop .35s both; }
.confete { position: fixed; top: -12px; width: 8px; height: 12px; border-radius: 2px; z-index: 70; pointer-events: none; animation: cai 1.3s cubic-bezier(.3,.6,.5,1) forwards; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .confete { display: none; }
}
/* cronômetro */
.tm-ok { color: var(--good); } .tm-over { color: var(--bad); }
.serie-box { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 12px; padding: 10px; }
.serie-box .info { flex: 1; min-width: 0; font-size: 13px; color: var(--ink-2); line-height: 1.35; }
.serie-box .info .t { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; color: var(--ink); }
.serie-box .btn { white-space: nowrap; }
.serie-box .lista { font-size: 12px; color: var(--ink-3); }
.tbar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--surface-2); margin: 6px 0 4px; }
.tbar > div { height: 100%; }
.tleg { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); }
.tleg i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.opcoes { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.opcoes .chip { padding: 5px 10px; font-size: 13px; }

/* janelinha de confirmação */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; z-index: 60; animation: fade .15s ease-out; }
.modal-bg .modal { animation: pop .2s ease-out; }
.modal { background: var(--surface); border-radius: 16px; padding: 18px; width: 100%; max-width: 360px; box-shadow: 0 12px 40px rgba(0,0,0,.3); }
.modal p { margin: 0 0 16px; font-size: 16px; }
.modal .row { justify-content: flex-end; }
.btn.perigo { background: var(--bad); border-color: var(--bad); color: #fff; }
.sticky-save { position: fixed; left: 0; right: 0; bottom: 62px; display: flex; justify-content: center; padding: 0 16px; pointer-events: none; z-index: 15; }
.sticky-save .btn { pointer-events: auto; width: 100%; max-width: 728px; padding: 13px; font-size: 16px; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.progress { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin: 8px 0 14px; }
.progress > div { height: 100%; background: var(--good); transition: width .2s; }
.daygrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.daybtn { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; cursor: pointer; }
.daybtn.sug { border-color: var(--accent); }
.daybtn .d { font-weight: 600; } .daybtn .f { font-size: 13px; color: var(--ink-2); }
.daybtn .l { font-size: 12px; color: var(--ink-3); margin-top: 4px; display: flex; gap: 6px; align-items: center; }

/* histórico */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 13px; }
.cal .h { color: var(--ink-3); font-size: 12px; padding: 2px 0; }
.cal .c { aspect-ratio: 1; display: grid; place-items: center; border-radius: 10px; color: var(--ink-2); border: 0; background: none; padding: 0; }
.cal .c.t { background: var(--accent-soft); color: var(--accent); font-weight: 600; cursor: pointer; }
.cal .c.today { outline: 1.5px solid var(--ink-3); outline-offset: -2px; }
.cal .c.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.sess { cursor: pointer; }
.sess .top { display: flex; gap: 10px; align-items: baseline; }

/* toast / loading */

/* card de altura fixa: três linhas, os detalhes abrem num painel */

  background: rgba(14,17,23,.75); color: #fff; font-size: 8px; display: grid; place-items: center; padding-left: 1px; }

.tags1 .tag:not(.m):not(.p) { flex: none; } /* inclinação, descanso e "+N" são curtos: só método e pegada encolhem */

.ex.done .hist { color: var(--good); }

/* exercício concluído: sai de cena (mais baixo e apagado), na mesma posição da ficha; o ✓ e o resultado seguem legíveis */

.ex.done .check { width: 24px; height: 24px; font-size: 13px; }

/* ao concluir, encolhe e apaga aos poucos (o card é redesenhado, por isso animação e não transição) */
.ex.done.concluiu { animation: verde .7s ease-out, encolhe .4s ease-out; }
.ex.done.concluiu .thumb { animation: encolheFoto .4s ease-out; }

// ====================================================================== estado

// ====================================================================== servidor
function call(fn, ...args) {
  if (FORA_GAS) return chamarApi(fn, args);
  return new Promise((ok, err) => google.script.run.withSuccessHandler(ok).withFailureHandler(err)[fn](...args));
}
// ---------------------------------------------------------------- fora do Apps Script (app Android)
// A página também roda no app Android (GitHub Pages dentro de um WebView). Lá não há google.script.run:
// as mesmas funções são chamadas pela ponte do relógio, que usa este projeto como biblioteca, com a chave do app.
const FORA_GAS = !(window.google && google.script && google.script.run);
const API_APP = 'https://script.google.com/macros/s/AKfycbwmfrUswieUGZP-ms-GY7u1oTwAvmtoFSEHvQfT8Xul1__msj6ptuOFDD2UbsliVQPI/exec';
const LS_CHAVE = 'fichas-chave-app';
const ANDROID = window.Android || null; // ponte com o app nativo (notificação, vibração, tela ligada)
function chaveApp() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.length >= 16) { lsSet(LS_CHAVE, h); history.replaceState(null, '', location.pathname + location.search); }
  return lsGet(LS_CHAVE) || '';
}
async function chamarApi(fn, args) {
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), 30000);
  try {
    const r = await fetch(API_APP, { method: 'POST', body: JSON.stringify({ k: chaveApp(), fn, args }), signal: ac.signal });
    const j = await r.json();
    if (j.erro) throw new Error(j.erro === 'Acesso negado.' ? 'Chave do app inválida' : j.erro);
    return j.ok;
  } catch (e) {
    throw e && e.name === 'AbortError' ? new Error('sem resposta') : e;
  } finally { clearTimeout(t); }
}
/** Primeira abertura do app: pede a chave (ou ela vem num link treino://chave/...). */

function planoDe(it) {

  const linhas = Math.max(num(it.seriesTotal) || 0, (it.serT || []).length, 1);

    const reps = a.reps != null ? a.reps : rf.lista ? rf.lista[k] : rf.todas;

    const msg = !feitos.length ? 'Nenhum exercício marcado como feito. Concluir o treino mesmo assim?'
      : faltam ? `Faltam ${faltam} de ${f.itens.length} exercícios. Concluir o treino?` : 'Concluir o treino?';

async function retomarTreino(id) {
  if (!podeRetomar(id)) return toast('Esse treino não pode mais ser retomado');
  if (S.form && !emPrevia() && !await confirmar(S.form.id ? 'Há um treino sendo editado. Sair sem salvar e retomar este?' : 'Há um treino em andamento. Descartar e retomar este?',
    { ok: 'Retomar', perigo: true })) return;
  const u = lsGet(ULTIMO), f = u.form, t = agora();
  f.idSalvo = String(id); f.id = null;
  if (f.inicio) {
    // o tempo entre concluir e retomar conta como pausa; séries que ficaram abertas terminam onde o treino foi concluído
    if (!f.pausadoEm) f.pausaMs = (f.pausaMs || 0) + (t - u.em);
    f.itens.forEach(it => (it.serT || []).forEach(x => { if (x.fim == null) x.fim = u.em; }));
    f.atual = null;
  }
  S.form = completarRascunho(f); S.naHome = false;
  lsSet(ULTIMO, null); salvarRascunho();
  irPara('treinar'); window.scrollTo(0, 0);
  toast('Treino retomado ⏱');
}

// ====================================================================== HISTÓRICO
function telaHistorico() {
  if (!X.sessoes.length) return `<h1>Histórico</h1><div class="card empty">Nenhum treino registrado ainda.<br>Vá em <b>Treinar</b> e registre o primeiro.</div>`;
  const mes = S.mes || X.sessoes[0].data.slice(0, 7);
  const [y, m] = mes.split('-').map(Number);
  const prim = new Date(y, m - 1, 1), nDias = new Date(y, m, 0).getDate();
  const off = (prim.getDay() + 6) % 7;
  const porDia = new Map();
  X.sessoes.forEach(s => { if (!porDia.has(s.data)) porDia.set(s.data, []); porDia.get(s.data).push(s); });
  let cal = ['seg', 'ter', 'qua', 'qui', 'sex', 'sáb', 'dom'].map(d => `<div class="h">${d}</div>`).join('');
  for (let i = 0; i < off; i++) cal += '<div></div>';
  for (let d = 1; d <= nDias; d++) {
    const iso = `${mes}-${pad(d)}`, t = porDia.has(iso);
    cal += `<button class="c ${t ? 't' : ''} ${iso === hoje() ? 'today' : ''} ${iso === S.diaSel ? 'sel' : ''}" ${t ? `onclick="S.diaSel=S.diaSel==='${iso}'?null:'${iso}'; render()"` : 'disabled'}>${d}</button>`;
  }
  const doMes = X.sessoes.filter(s => s.data.startsWith(mes));
  const lista = S.diaSel ? doMes.filter(s => s.data === S.diaSel) : doMes;
  const semana = inicioSemana(hoje());
  const nSem = X.sessoes.filter(s => s.data >= semana && s.data <= hoje()).length;
  const mov = k => { const d = new Date(y, m - 1 + k, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
  return `
    <h1>Histórico</h1>
    <div class="tiles">
      <div class="tile"><div class="k">Semana</div><div class="v">${nSem}</div><div class="s">${nSem === 1 ? 'treino' : 'treinos'}</div></div>
      <div class="tile"><div class="k" style="text-transform:capitalize">${MESES[m - 1]}</div><div class="v">${doMes.length}</div><div class="s">${doMes.length === 1 ? 'treino' : 'treinos'}</div></div>
      <div class="tile"><div class="k">Total</div><div class="v">${X.sessoes.length}</div><div class="s">desde ${fmtData(X.sessoes[X.sessoes.length - 1].data)}</div></div>
    </div>
    <div class="card">
      <div class="row" style="margin-bottom:8px">
        <button class="btn small ghost" onclick="S.mes='${mov(-1)}'; S.diaSel=null; render()" aria-label="Mês anterior">‹</button>
        <b style="flex:1; text-align:center; text-transform:capitalize">${MESES[m - 1]} ${y}</b>
        <button class="btn small ghost" onclick="S.mes='${mov(1)}'; S.diaSel=null; render()" aria-label="Próximo mês">›</button>
      </div>
      <div class="cal">${cal}</div>
    </div>
    ${S.diaSel ? `<div class="row small muted" style="margin:4px 0 8px">Mostrando ${fmtDataLonga(S.diaSel)} · <a href="#" onclick="S.diaSel=null; render(); return false">ver o mês todo</a></div>` : ''}
    ${lista.length ? lista.map(cardSessao).join('') : `<div class="card empty">Nenhum treino em ${MESES[m - 1]}.</div>`}`;
}
/** ⏱ 6:10 · 4 séries · descanso médio 1:05 (ficha 0:40) */
/** Batimentos por série gravados ('128/141 132/150', '-' = sem leitura) → linha "♥ 1ª 128/141 · 2ª 132/150". */
function linhaFcEx(r) {
  const p = String(r.fcSeries || '').trim().split(/\s+/).filter(Boolean);
  if (!p.some(x => x !== '-')) return '';
  return `<div class="small muted">♥ média/pico: ${p.map((x, k) => `${k + 1}ª ${x === '-' ? '—' : esc(x)}`).join(' · ')}</div>`;
}
function linhaTempoEx(r, s) {
  if (!r.tempoEx) return linhaFcEx(r);
  const d = descansosDe(r.tempos), medio = d.length ? d.reduce((a, b) => a + b, 0) / d.length : null;
  const fichaD = num(X.descFicha.get(`${s.ficha}|${s.dia}|${r.exercicio}`));
  const acima = medio != null && fichaD && medio > fichaD * 1.25;
  return `<div class="small muted">⏱ ${fmtT(r.tempoEx * 1000)} · ${plural(r.nSeries, 'série')}${medio != null ? ` · descanso médio <span class="${acima ? 'tm-over' : ''}">${fmtT(medio * 1000)}</span>${fichaD ? ` (ficha ${fmtT(fichaD * 1000)})` : ''}` : ''}</div>${linhaFcEx(r)}`;
}

  const prs = feitos.filter(r => r.pr).length;
  const aberta = S.sessAberta === String(s.id);
  return `<div class="card sess">
    <div class="top" onclick="S.sessAberta=S.sessAberta==='${esc(s.id)}'?null:'${esc(s.id)}'; render()">
      <span class="dt">${fmtDataLonga(s.data)}</span>
      <div style="flex:1">
        <div><b>${esc(s.dia)}</b> — ${esc(s.foco)}</div>
        <div class="small muted row" style="gap:6px">${gDots(feitos.map(r => r.grupo))}<span>${esc(s.ficha)} · ${feitos.length}/${regs.length} exercícios${s.duracao ? ' · ⏱ ' + fmtMin(s.duracao) : ''}${s.fcMed ? ' · ♥ ' + s.fcMed : ''}</span></div>
      </div>
      ${prs ? `<span class="badge gold">🏆 ${prs}</span>` : ''}
      <span class="muted">${aberta ? '▾' : '▸'}</span>
    </div>
    ${aberta ? `
      ${s.duracao ? `<div style="margin-top:10px"><div class="small"><b>⏱ ${fmtMin(s.duracao)}</b>${s.inicio ? ` · ${esc(s.inicio)}–${esc(s.fim)}` : ''}${s.fcMed ? ` · ♥ média ${s.fcMed} · pico ${s.fcMax}` : ''}</div>${barraTempos(s)}</div>` : ''}
      <table class="t" style="margin-top:10px">
        <tr><th>Exercício</th><th class="num">Carga</th><th class="num">vs. anterior</th></tr>
        ${regs.map(r => {
          const dif = r.feito && r.carga != null && r.ant != null ? r.carga - r.ant : null;
          return `<tr class="${r.feito ? '' : 'muted'}">
            <td><span class="gdot" style="${gStyle(r.grupo)}; margin-right:6px"></span>${esc(r.exercicio)}${r.pr ? ' <span class="badge gold">🏆</span>' : ''}${r.ajuste || r.inclinacao || r.obs ? `<div class="small muted">${[r.ajuste ? 'ajuste ' + esc(r.ajuste) : '', r.inclinacao ? '📐 ' + esc(r.inclinacao) : '', esc(r.obs)].filter(Boolean).join(' · ')}</div>` : ''}${linhaTempoEx(r, s)}</td>
            <td class="num">${r.feito ? (r.carga != null ? fmtKg(r.carga) + ' kg' + r.dropsArr.map(x => ' → ' + fmtKg(x)).join('') : 'feito') : 'não fez'}</td>
            <td class="num ${dif > 0 ? 'up' : dif < 0 ? 'down' : 'muted'}">${dif == null ? '' : dif === 0 ? '=' : (dif > 0 ? '▲ +' : '▼ ') + fmtKg(dif)}</td>
          </tr>`;
        }).join('')}
      </table>
      ${s.obs ? `<p class="small" style="margin:10px 0 0">📝 ${esc(s.obs)}</p>` : ''}
      <div class="row" style="margin-top:12px">
        ${podeRetomar(s.id) ? `<button class="btn small primary" onclick="retomarTreino('${esc(s.id)}')">↺ Retomar</button>` : ''}
        <button class="btn small" onclick="editarSessao('${esc(s.id)}')">Editar</button>
        <button class="btn small" onclick="repetirSessao('${esc(s.id)}')">Treinar de novo</button>
        <span class="spacer"></span>
        <button class="btn small danger" onclick="excluir('${esc(s.id)}')">Excluir</button>
      </div>` : ''}
  </div>`;
}
async function editarSessao(id) {
  const s = X.sessaoPorId.get(String(id)); if (!s) return;
  if (S.form && !emPrevia() && !await confirmar('Há um treino em andamento. Descartar e editar este?', { ok: 'Descartar e editar', perigo: true })) return;
  S.naHome = false;
  const ficha = (X.dias.get(s.ficha) || []).find(d => d.dia === s.dia);
  const ref = new Map((ficha ? ficha.itens : []).map(it => [it.exercicio, it]));
  S.form = {
    id: String(s.id), data: s.data, ficha: s.ficha, dia: s.dia, foco: s.foco, obs: s.obs || '',
    // editar não mexe nos tempos gravados
    tempoFixo: { inicio: s.inicio, fim: s.fim, duracao: s.duracao, execucao: s.execucao, descanso: s.descanso, troca: s.troca, pausa: s.pausa,
      fcMed: s.fcMed, fcMax: s.fcMax },
    itens: (X.regsPorSessao.get(String(id)) || []).map(r => {
      const it = novoItem(ref.get(r.exercicio) || { exercicio: r.exercicio }, !ref.has(r.exercicio));
      it.grupo = r.grupo || it.grupo; it.carga = r.carga == null ? it.carga : r.carga; it.feito = r.feito; it.obs = r.obs || ''; it.ajuste = r.ajuste ? String(r.ajuste) : it.ajuste;
      it.drops = r.dropsArr.slice(); it.inclinacao = r.inclinacao ? String(r.inclinacao) : '';
      it.plan = (r.kr || []).map(x => ({ kg: x.kg == null ? '' : x.kg, reps: x.reps == null ? '' : x.reps }));
      it.tempoFixo = { nSeries: r.nSeries, tempoEx: r.tempoEx, execSeg: r.execSeg, descSeg: r.descSeg, tempos: r.tempos, fc: r.fcSeries || '' };
      return it;
    }),
  };
  salvarRascunho(); irPara('treinar');
}
async function repetirSessao(id) {
  const s = X.sessaoPorId.get(String(id)); if (!s) return;
  if (!(X.dias.get(s.ficha) || []).some(d => d.dia === s.dia)) return toast(`A ficha ${s.ficha} não está mais no app`);
  iniciar(s.ficha, s.dia);
}
async function excluir(id) {
  if (!await confirmar('Excluir este treino e as cargas dele? Isso não pode ser desfeito.', { ok: 'Excluir', perigo: true })) return;
  $('#main').classList.add('busy');
  const eraUltimo = podeRetomar(id);
  try { indexar(await call('excluirSessao', id)); if (eraUltimo) lsSet(ULTIMO, null); S.sessAberta = null; render(); toast('Treino excluído'); }
  catch (e) { erro(e); } finally { $('#main').classList.remove('busy'); }
}

function telaEvolucao() {
  const sel = S.exSel;
  const comReg = [...X.regsPorEx.keys()];
  const grupos = [...new Set(S.d.exercicios.map(e => e.grupo))].sort();
  const opts = `<option value="">— Visão geral —</option>
    ${comReg.length ? `<optgroup label="Com cargas registradas">${comReg.sort((a, b) => a.localeCompare(b)).map(e => `<option ${e === sel ? 'selected' : ''}>${esc(e)}</option>`).join('')}</optgroup>` : ''}
    ${grupos.map(g => `<optgroup label="${esc(g)}">${S.d.exercicios.filter(e => e.grupo === g && !X.regsPorEx.has(e.exercicio)).sort((a, b) => a.exercicio.localeCompare(b.exercicio)).map(e => `<option ${e.exercicio === sel ? 'selected' : ''}>${esc(e.exercicio)}</option>`).join('')}</optgroup>`).join('')}`;
  return `<h1>Evolução</h1>
    <label class="field">Exercício<select onchange="S.exSel=this.value||null; render()">${opts}</select></label>
    ${sel ? `<div class="row" style="flex-wrap:nowrap; margin:-2px 0 12px">${miniatura(sel, X.grupoDe.get(sel))}
      <div><b>${esc(sel)}</b><div class="small">${gTag(X.grupoDe.get(sel))}</div></div></div>` + evoExercicio(sel) : evoGeral()}`;
}

function evoGeral() {
  const h = hoje();
  const d30 = isoDe(new Date(Date.now() - 30 * 864e5));
  const s30 = X.sessoes.filter(s => s.data > d30);
  const prs30 = S.d.registros.filter(r => r.pr && r.data > d30);
  const semanas = [];
  for (let k = 11; k >= 0; k--) { const d = dataDe(inicioSemana(h)); d.setDate(d.getDate() - 7 * k); semanas.push(isoDe(d)); }
  const media8 = X.sessoes.filter(s => s.data >= semanas[4]).length / 8;
  // evolução por exercício
  const evo = [...X.regsPorEx.entries()].filter(([, a]) => a.length >= 2).map(([ex, a]) => {
    const p = a[0].carga, u = a[a.length - 1].carga;
    let semAumento = 0;
    for (let i = a.length - 1; i > 0 && !a[i].pr; i--) semAumento++;
    return { ex, p, u, pct: p > 0 ? (u - p) / p * 100 : null, n: a.length, semAumento, rec: X.recorde.get(ex) };
  });
  const melhores = evo.filter(e => e.pct != null && e.pct > 0).sort((a, b) => b.pct - a.pct).slice(0, 8);
  const parados = evo.filter(e => e.semAumento >= 4).sort((a, b) => b.semAumento - a.semAumento).slice(0, 8);
  // tempo: duração média e onde o descanso passa do da ficha
  const comDur = X.sessoes.filter(s => s.duracao).slice(0, 10);
  const durMedia = comDur.length ? comDur.reduce((a, s) => a + s.duracao, 0) / comDur.length : null;
  const tot = k => comDur.reduce((a, s) => a + (s[k] || 0), 0);
  const descEx = new Map();
  S.d.registros.forEach(r => {
    const d = descansosDe(r.tempos), fd = num(X.descFicha.get(`${r.ficha}|${r.dia}|${r.exercicio}`));
    if (!d.length || !fd) return;
    const e = descEx.get(r.exercicio) || { soma: 0, n: 0, ficha: fd };
    d.forEach(x => { e.soma += x; e.n++; }); descEx.set(r.exercicio, e);
  });
  const acima = [...descEx].map(([ex, e]) => ({ ex, medio: e.soma / e.n, ficha: e.ficha })).filter(e => e.medio > e.ficha + 10)
    .sort((a, b) => (b.medio - b.ficha) - (a.medio - a.ficha)).slice(0, 6);
  const linha = (e, dir) => `<div class="list-item" onclick="S.exSel=${JSON.stringify(e.ex).replace(/"/g, '&quot;')}; render(); scrollTo(0,0)">
      <div style="flex:1">${esc(e.ex)}<div class="small muted">${fmtKg(e.p)} → ${fmtKg(e.u)} kg · ${plural(e.n, 'vez', 'vezes')}</div></div>
      ${dir === 'up' ? `<span class="badge good">▲ ${Math.round(e.pct)}%</span>` : `<span class="badge">${e.semAumento} treinos sem subir</span>`}
    </div>`;
  if (!X.sessoes.length) return `<div class="card empty">Registre alguns treinos para ver sua evolução aqui.</div>`;
  return `
    <div class="tiles">
      <div class="tile"><div class="k">30 dias</div><div class="v">${s30.length}</div><div class="s">${s30.length === 1 ? 'treino' : 'treinos'}</div></div>
      <div class="tile"><div class="k">Por semana</div><div class="v">${media8.toLocaleString('pt-BR', { maximumFractionDigits: 1 })}</div><div class="s">média de 8 sem.</div></div>
      <div class="tile"><div class="k">Recordes</div><div class="v">${prs30.length}</div><div class="s">${prs30.length ? '🏆 ' + esc([...new Set(prs30.map(r => r.exercicio))].slice(0, 2).join(', ')) : 'bora subir carga'}</div></div>
    </div>
    ${durMedia ? `<div class="card">
      <h3>Tempo de treino</h3><div class="small muted">média dos últimos ${plural(comDur.length, 'treino')} com cronômetro: <b>${fmtMin(durMedia)}</b></div>
      ${barraTempos({ execucao: tot('execucao'), descanso: tot('descanso'), troca: tot('troca') })}
      ${acima.length ? `<div class="small" style="margin-top:10px"><b>Descanso acima da ficha</b></div>
        ${acima.map(e => `<div class="list-item" style="cursor:default"><div style="flex:1">${esc(e.ex)}</div><span class="small"><span class="tm-over">${fmtT(e.medio * 1000)}</span> <span class="muted">/ ${fmtT(e.ficha * 1000)}</span></span></div>`).join('')}` : ''}
    </div>` : ''}
    <div class="card">
      <h3>Treinos por semana</h3><div class="small muted" style="margin-bottom:8px">últimas 12 semanas</div>
      <div class="chartbox" style="height:180px"><canvas id="g-semanas" data-semanas='${esc(JSON.stringify(semanas))}'></canvas></div>
    </div>
    <div class="card">
      <h3>Exercícios por grupo muscular</h3><div class="small muted" style="margin-bottom:8px">feitos nas últimas 4 semanas · Costas inclui lombar, Pernas inclui panturrilha</div>
      <div class="chartbox" style="height:230px"><canvas id="g-grupos"></canvas></div>
    </div>
    <h2>Maiores evoluções</h2>
    <div class="card">${melhores.length ? melhores.map(e => linha(e, 'up')).join('') : '<div class="empty">Ainda sem aumentos de carga registrados.</div>'}</div>
    ${parados.length ? `<h2>Estagnados</h2><div class="card">${parados.map(e => linha(e, 'flat')).join('')}</div>` : ''}`;
}

function evoExercicio(ex) {
  const a = X.regsPorEx.get(ex) || [];
  if (!a.length) return `<div class="card empty">Você ainda não registrou carga para <b>${esc(ex)}</b>.</div>`;
  const rec = X.recorde.get(ex), recR = a.find(r => r.carga === rec);
  const p = a[0], u = a[a.length - 1];
  const pct = p.carga > 0 ? (u.carga - p.carga) / p.carga * 100 : null;
  return `
    <div class="tiles t4">
      <div class="tile"><div class="k">🏆 Recorde</div><div class="v">${fmtKg(rec)} <small class="muted">kg</small></div><div class="s">${fmtData(recR.data, true)}</div></div>
      <div class="tile"><div class="k">Última</div><div class="v">${fmtKg(u.carga)} <small class="muted">kg</small></div><div class="s">há ${plural(diasEntre(u.data, hoje()), 'dia')}</div></div>
      <div class="tile"><div class="k">Desde o início</div><div class="v ${pct > 0 ? 'up' : pct < 0 ? 'down' : ''}">${pct == null ? '—' : (pct > 0 ? '+' : '') + Math.round(pct) + '%'}</div><div class="s">${fmtKg(p.carga)} → ${fmtKg(u.carga)} kg</div></div>
      <div class="tile"><div class="k">Vezes</div><div class="v">${a.length}</div><div class="s">desde ${fmtData(p.data, true)}</div></div>
    </div>
    ${a.length >= 2 ? `<div class="card"><h3>Carga ao longo do tempo</h3><div class="small muted" style="margin-bottom:8px">kg · 🏆 = recorde</div>
      <div class="chartbox"><canvas id="g-ex" data-ex="${esc(ex)}"></canvas></div></div>` : ''}
    <h2>Registros</h2>
    <div class="card"><table class="t"><tr><th>Data</th><th>Ficha</th><th class="num">Carga</th><th class="num">Δ</th></tr>
      ${[...a].reverse().map(r => { const dif = r.ant != null ? r.carga - r.ant : null; return `<tr>
        <td>${fmtData(r.data, true)}</td><td class="small">${esc(r.ficha)} · ${esc(r.dia)}</td>
        <td class="num">${fmtKg(r.carga)} kg${r.pr ? ' 🏆' : ''}</td>
        <td class="num ${dif > 0 ? 'up' : dif < 0 ? 'down' : 'muted'}">${dif == null ? '' : dif === 0 ? '=' : (dif > 0 ? '+' : '') + fmtKg(dif)}</td></tr>`; }).join('')}
    </table></div>`;
}

function desenharGraficos() {
  if (typeof Chart === 'undefined') return;
  const ink3 = css('--ink-3'), line = css('--line'), accent = css('--accent'), gold = css('--gold'), surface = css('--surface');
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  Chart.defaults.color = ink3;
  const tooltip = { backgroundColor: css('--ink'), titleColor: css('--bg'), bodyColor: css('--bg'), padding: 10, cornerRadius: 8, displayColors: false };

  const gs = document.getElementById('g-semanas');
  if (gs) {
    const semanas = JSON.parse(gs.dataset.semanas);
    const cont = semanas.map((s, i) => X.sessoes.filter(x => x.data >= s && (i === semanas.length - 1 || x.data < semanas[i + 1])).length);
    charts.push(new Chart(gs, {
      type: 'bar',
      data: { labels: semanas.map(s => fmtData(s)), datasets: [{ data: cont, backgroundColor: accent, borderRadius: { topLeft: 4, topRight: 4 }, borderSkipped: 'bottom', maxBarThickness: 28 }] },
      options: {
        maintainAspectRatio: false, animation: false,
        plugins: { legend: { display: false }, tooltip: { ...tooltip, callbacks: { title: i => 'Semana de ' + i[0].label, label: i => plural(i.raw, 'treino') } } },
        scales: { x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 6 } },
                  y: { beginAtZero: true, ticks: { precision: 0, maxTicksLimit: 5 }, grid: { color: line }, border: { display: false } } },
      },
    }));
  }

  const gg = document.getElementById('g-grupos');
  if (gg) {
    const desde = isoDe(new Date(Date.now() - 28 * 864e5));
    const cont = Object.fromEntries(ORDEM_BASE.map(b => [b, 0]));
    S.d.registros.forEach(r => { const b = baseGrupo(r.grupo || X.grupoDe.get(r.exercicio)); if (r.feito && r.data > desde && b in cont) cont[b]++; });
    charts.push(new Chart(gg, {
      type: 'bar',
      data: { labels: ORDEM_BASE.map(b => NOME_BASE[b]), datasets: [{
        data: ORDEM_BASE.map(b => cont[b]), backgroundColor: ORDEM_BASE.map(b => css('--g-' + b)),
        borderRadius: { topRight: 4, bottomRight: 4 }, borderSkipped: 'left', maxBarThickness: 22,
      }] },
      options: {
        indexAxis: 'y', maintainAspectRatio: false, animation: false,
        plugins: { legend: { display: false }, tooltip: { ...tooltip, callbacks: { label: i => plural(i.raw, 'exercício') } } },
        scales: { y: { grid: { display: false }, ticks: { color: css('--ink-2') } },
                  x: { beginAtZero: true, ticks: { precision: 0, maxTicksLimit: 5 }, grid: { color: line }, border: { display: false } } },
      },
    }));
  }

  const ge = document.getElementById('g-ex');
  if (ge) {
    const a = X.regsPorEx.get(ge.dataset.ex) || [];
    const porData = new Map();
    a.forEach(r => { const p = porData.get(r.data); if (!p || r.carga > p.carga) porData.set(r.data, r); });
    const pts = [...porData.values()];
    const t0 = dataDe(pts[0].data).getTime();
    charts.push(new Chart(ge, {
      type: 'line',
      data: { datasets: [{
        data: pts.map(r => ({ x: (dataDe(r.data).getTime() - t0) / 864e5, y: r.carga, r })),
        borderColor: accent, borderWidth: 2, tension: 0, fill: false,
        pointRadius: pts.map(r => r.pr ? 6 : 4), pointHoverRadius: 7,
        pointBackgroundColor: pts.map(r => r.pr ? gold : accent), pointBorderColor: surface, pointBorderWidth: 2,
      }] },
      options: {
        maintainAspectRatio: false, animation: false,
        interaction: { mode: 'nearest', axis: 'x', intersect: false },
        plugins: { legend: { display: false }, tooltip: { ...tooltip, callbacks: {
          title: i => fmtDataLonga(i[0].raw.r.data),
          label: i => `${fmtKg(i.raw.y)} kg${i.raw.r.pr ? '  🏆 recorde' : ''}`,
          afterLabel: i => `${i.raw.r.ficha} · ${i.raw.r.dia}`,
        } } },
        scales: {
          x: { type: 'linear', grid: { display: false }, ticks: { maxTicksLimit: 6, callback: v => { const d = new Date(t0 + v * 864e5); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; } } },
          y: { grace: '10%', ticks: { maxTicksLimit: 5, callback: v => fmtKg(v) }, grid: { color: line }, border: { display: false } },
        },
      },
    }));
  }
}

// ====================================================================== FICHAS
function telaFichas() {
  return `<h1>Fichas</h1>
    <p class="small muted">A ficha ativa aparece primeiro na tela Treinar. Para incluir fichas novas, adicione linhas nas abas “Fichas” e “Itens das fichas” da planilha.</p>
    ${[...X.fichas].reverse().map(f => {
      const dias = X.dias.get(f.ficha) || [];
      const aberta = S.fichaAberta === f.ficha;
      const nSess = X.sessoes.filter(s => s.ficha === f.ficha).length;
      const fj = JSON.stringify(f.ficha).replace(/"/g, '&quot;');
      return `<div class="card">
        <div class="row" style="cursor:pointer" onclick="S.fichaAberta=S.fichaAberta===${fj}?null:${fj}; render()">
          <div style="flex:1"><h3>${esc(f.ficha)} ${f.ativa ? '<span class="badge accent">ativa</span>' : ''}</h3>
            <div class="small muted">${plural(dias.length, 'dia')} · ${dias.map(d => esc(d.foco)).join(' / ')}</div>
            ${nSess ? `<div class="small muted">${plural(nSess, 'treino feito', 'treinos feitos')}</div>` : ''}</div>
          <span class="muted">${aberta ? '▾' : '▸'}</span>
        </div>
        ${aberta ? `
          ${f.ativa ? '' : `<button class="btn small" style="margin-top:10px" onclick="tornarAtiva(${fj})">Tornar ativa</button>`}
          ${dias.map(d => `<div class="ficha-dia">
            <div class="row"><b>${esc(d.dia)}</b><span class="muted">— ${esc(d.foco)}</span><span class="spacer"></span>
              <button class="btn small primary" onclick="treinarDia(${fj}, ${JSON.stringify(d.dia).replace(/"/g, '&quot;')})">Treinar</button></div>
            <table class="t" style="margin-top:6px">
              ${d.itens.map(i => `<tr><td><span class="gdot" style="${gStyle(i.grupo)}; margin-right:6px"></span>${esc(i.exercicio)}${tagsItem({ tecnica: i.tecnica, metodo: i.metodo, inclFicha: i.inclinacao, pegada: i.pegada, descanso: i.descanso })}${i.obs ? `<div class="small muted" style="margin-top:4px">📝 ${esc(i.obs)}</div>` : ''}</td>
                <td class="num small">${esc(seriesReps(i))}</td></tr>`).join('')}
            </table></div>`).join('')}` : ''}
      </div>`;
    }).join('')}`;
}
// ====================================================================== GUIA (demonstrações)
/** Todos os exercícios do catálogo com a demonstração (início/fim do movimento). Os da ficha ativa primeiro. */
function telaGuia() {
  return `<h1>Guia de exercícios</h1>
    <input type="search" class="guia-busca" placeholder="Buscar exercício" value="${esc(S.guiaQ || '')}" oninput="S.guiaQ = this.value; desenharGuia()">
    <div id="guia-l">${guiaHtml()}</div>`;
}
function desenharGuia() { const el = document.getElementById('guia-l'); if (el) el.innerHTML = guiaHtml(); }
/** Um menu por grupo muscular; toque abre os exercícios do grupo. Buscando, mostra os grupos que têm resultado já abertos. */
function guiaHtml() {
  const tira = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const q = tira(S.guiaQ).trim();
  const lista = (S.d.exercicios || []).filter(e => !q || tira(e.exercicio + ' ' + e.grupo + ' ' + (e.nomes || '')).includes(q));
  if (!lista.length) return `<div class="empty">Nenhum exercício encontrado.</div>`;
  const grupos = new Map();
  lista.forEach(e => { if (!grupos.has(e.grupo)) grupos.set(e.grupo, []); grupos.get(e.grupo).push(e); });
  return [...grupos].map(([g, l]) => {
    const aberto = !!q || S.guiaAberto === g;
    return `<div class="guia-g ${aberto ? 'aberto' : ''}">
      <button class="guia-h" style="${gStyle(g)}" onclick="S.guiaAberto = S.guiaAberto === ${jsArg(g)} ? null : ${jsArg(g)}; desenharGuia()">
        <span class="gdot"></span><b>${esc(g)}</b><span class="muted">${l.length}</span><i>${aberto ? '▾' : '▸'}</i></button>
      ${aberto ? `<div class="guia">${l.map(e => {
        const ft = fotoDe(e.exercicio);
        return `<button class="gi" onclick="abrirFoto(${jsArg(e.exercicio)}, ${jsArg(e.grupo)})">
          ${ft ? `<img src="${ft}" alt="" loading="lazy">` : `<span class="sem">${corpoSVG(e.grupo, ladoDoGrupo(e.grupo))}</span>`}
          <b>${esc(e.exercicio)}</b></button>`;
      }).join('')}</div>` : ''}</div>`;
  }).join('');
}
async function tornarAtiva(ficha) {
  $('#main').classList.add('busy');
  try { indexar(await call('definirFichaAtiva', ficha)); S.fichaSel = null; render(); toast(`${ficha} agora é a ficha ativa`); }
  catch (e) { erro(e); } finally { $('#main').classList.remove('busy'); }
}
async function treinarDia(ficha, dia) { iniciar(ficha, dia); }
// ====================================================================== início
const LS_CACHE = 'fichas-cache-dados';
function abrirComDados(d) {
  indexar(d);
  const r = lsGet(RASCUNHO);
  if (r && r.ficha && Array.isArray(r.itens) && X.dias.has(r.ficha)) { S.form = completarRascunho(r); S.naHome = true; } // mostra o aviso "Treino em andamento"
  else lsSet(RASCUNHO, null);
  irPara('treinar');
  avisarAndroid();
}
(async function () {
  if (FORA_GAS && !chaveApp()) return telaChave();
  // abre na hora com os dados da última vez; os novos chegam em seguida
  const cache = FORA_GAS ? lsGet(LS_CACHE) : null;
  if (cache) { try { abrirComDados(cache); } catch (e) { console.warn(e); } }
  try {
    const d = await call('getDados');
    if (!cache) abrirComDados(d);
    else {
      indexar(d);
      const digitando = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
      if (!digitando && !document.querySelector('.modal-bg, .sheet')) render();
    }
  } catch (e) {
    if (/Chave do app/.test(e && e.message)) { lsSet(LS_CHAVE, null); return telaChave('Chave inválida. Digite de novo.'); }
    if (cache) return toast('Sem conexão: mostrando os dados da última vez', 5000);
    $('#main').innerHTML = `<div class="card empty">Não consegui carregar os dados.<br><span class="small">${esc(e && e.message || e)}</span></div>`;
  }
})();
</script>
