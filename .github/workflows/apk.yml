# Compila o app Android (pasta android/) e publica o APK em
# https://github.com/atiladivi/treino-relogio/releases/download/apk/treino.apk
# A chave de assinatura vem dos secrets KS_B64 e KS_PASS (nunca do código).
name: APK

on:
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Chave de assinatura
        id: chave
        env:
          KS_B64: ${{ secrets.KS_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "tem=nao" >> "$GITHUB_OUTPUT"; echo "::warning::Sem os secrets KS_B64/KS_PASS: só confere se compila (APK não publicado)"; exit 0; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/treino.p12"
          echo "tem=sim" >> "$GITHUB_OUTPUT"

      - name: Compilar
        env:
          VERSION_CODE: ${{ github.run_number }}
          KS_FILE: ${{ runner.temp }}/treino.p12
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          tarefa=assembleRelease; [ "${{ steps.chave.outputs.tem }}" = sim ] || tarefa=assembleDebug
          set -o pipefail
          gradle -p android $tarefa --no-daemon 2>&1 | tee gradle.log || {
            # erros viram anotações (dá para ler sem entrar no GitHub)
            grep -E "^e: |error:|FAILURE|What went wrong" -A3 gradle.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }

      - name: Publicar o APK
        if: steps.chave.outputs.tem == 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk treino.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk treino.apk --title "Treino (versão ${{ github.run_number }})"             --notes "APK do app Treino. Baixe no celular e instale por cima da versão anterior."
